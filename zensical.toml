[project]
site_name = "Physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model of simvastatin"
site_url = "https://matthiaskoenig.github.io/simvastatin-model/"
site_description = "This repository provides the simvastatin physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model: the oral absorption of simvastatin, its first pass metabolism by CYP3A4 in the intestine and the liver, its hydrolysis to the active simvastatin acid, the hepatic uptake of the acid by OATP1B1, the enterohepatic circulation and excretion of the metabolites and the inhibition of the HMG-CoA reductase with the lowering of the LDL cholesterol."
site_author = "Florian Bartsch and Matthias König"

copyright = "Copyright &copy; 2020-2026 Florian Bartsch and Matthias König"

# pages as `simulations.html`, so the reports which the docs workflow copies into
# the site (`simulations/`, `fit/`) do not replace the pages of the same name
use_directory_urls = false

repo_url = "https://github.com/matthiaskoenig/simvastatin-model"
repo_name = "matthiaskoenig/simvastatin-model"

nav = [
  { "Home" = "index.md" },
  { "Running the model" = "running.md" },
  { "Models" = "models.md" },
  { "Simulations" = "simulations.md" },
  { "Fit" = "fit.md" },
  { "Release notes" = "release-notes.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/simvastatin-model"
